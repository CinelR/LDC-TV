<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Signage</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #slide {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <img id="slide" src="Page1.png" alt="Slide">

    <script>
        const slides = [
            "Slide1.png",
            "Slide2.png"
        ];

        let current = 0;
        const slideElement = document.getElementById("slide");

        setInterval(() => {
            current = (current + 1) % slides.length;

            slideElement.src =
                slides[current] + "?v=" + Date.now();
        }, 10000);

        // Reload page every minute to pick up updates from GitHub
        setInterval(() => {
            location.reload();
        }, 60000);
    </script>

</body>
</html>
