<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LDC TV</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.7s ease-in-out;
}

.active {
    opacity: 1;
}
</style>
</head>
<body>

<img id="slideA" class="slide active" src="Slide1.PNG">
<img id="slideB" class="slide">

<script>
const slides = [
    "Slide1.PNG",
    "Slide2.PNG"
];

let currentSlide = 0;
let visible = "A";

const imgA = document.getElementById("slideA");
const imgB = document.getElementById("slideB");

setInterval(() => {

    currentSlide = (currentSlide + 1) % slides.length;

    if (visible === "A") {
        imgB.src = slides[currentSlide] + "?v=" + Date.now();

        imgB.classList.add("active");
        imgA.classList.remove("active");

        visible = "B";
    } else {
        imgA.src = slides[currentSlide] + "?v=" + Date.now();

        imgA.classList.add("active");
        imgB.classList.remove("active");

        visible = "A";
    }

}, 30000);

// Refresh every 5 minutes to catch GitHub updates
setInterval(() => {
    location.reload();
}, 300000);

</script>

</body>
</html>
