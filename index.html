<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LDC TV</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.7s ease-in-out;
}

.active {
    opacity: 1;
}

#clock {
    position: absolute;
    top: 20px;
    right: 30px;
    z-index: 1000;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 64px;
    font-weight: bold;

    background: rgba(0,0,0,0.4);
    padding: 10px 18px;
    border-radius: 10px;

    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<img id="slideA" class="slide active" src="Slide1.PNG">
<img id="slideB" class="slide">
<div id="clock"></div>
<script>
const slides = [
    "Slide1.PNG",
    "Slide2.PNG"
];

let currentSlide = 0;
let visible = "A";

const imgA = document.getElementById("slideA");
const imgB = document.getElementById("slideB");

setInterval(() => {

    currentSlide = (currentSlide + 1) % slides.length;

    if (visible === "A") {
        imgB.src = slides[currentSlide] + "?v=" + Date.now();

        imgB.classList.add("active");
        imgA.classList.remove("active");

        visible = "B";
    } else {
        imgA.src = slides[currentSlide] + "?v=" + Date.now();

        imgA.classList.add("active");
        imgB.classList.remove("active");

        visible = "A";
    }

}, 30000);

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString('nl-BE', {
        hour: '2-digit',
        minute: '2-digit'
    });

    document.getElementById('clock').textContent = time;
}

updateClock();
setInterval(updateClock, 1000);

// Refresh every 5 minutes to catch GitHub updates
setInterval(() => {
    location.reload();
}, 300000);

</script>

</body>
</html>
