<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LDC TV</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}
.metricRow {
    margin-bottom:4px;
}
    
.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.7s ease-in-out;
}

.active {
    opacity: 1;
}
    
#nps {
    position: absolute;
    top: 50px;
    right: 50px;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 48px;
    font-weight: bold;
}
    
#metricsContainer {
    position: absolute;
    left: 19%;
    bottom: 9.6%;
    z-index: 1000;
    font-family: Arial, sans-serif;
    transition: opacity 0.7s ease-in-out;
}
.metric {
    font-size: 25px;
    font-weight: bold;
}
    
#npsTarget {
    color: white;
    font-weight: normal;
    font-style: italic;
}
    
#clock {
    position: absolute;
    top: 20px;
    right: 30px;
    z-index: 1000;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 60px;
    font-weight: bold;

    background: rgba(0,0,0,0.4);
    padding: 10px 18px;
    border-radius: 10px;

    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<img id="slideA" class="slide active" src="Slide1.PNG">
<img id="slideB" class="slide">
<div id="metricsContainer">
    <div class="metricRow">
    <span id="npsValue" class="metric"></span>
    <span id="npsTarget" class="metric"></span>
    </div>
    <div class="metricRow">
    <span class="metric">1</span>
    <span class="metric">2</span>
    </div>
    <div class="metricRow">
    <span class="metric">3</span>
    <span class="metric">4</span>
    </div>
</div>
<div id="clock"></div>
<script>
async function loadData() {
    try {
        const response = await fetch("data.json?v=" + Date.now());
        const data = await response.json();

        const npsValue = document.getElementById("npsValue");
        const npsTarget = document.getElementById("npsTarget");

        npsValue.textContent = data.nps;
        npsTarget.textContent = "  (" + data.npsTarget + ")";

        if (data.nps >= data.npsTarget) {
            npsValue.style.color = "#00C853"; // Green
        } else {
            npsValue.style.color = "#D50000"; // Red
        }
    }
    catch (e) {
        console.error(e);
    }
}

const slides = [
    "Slide1.PNG",
    "Slide2.PNG"
];

let currentSlide = 0;
let visible = "A";

const imgA = document.getElementById("slideA");
const imgB = document.getElementById("slideB");
const metrics = document.getElementById("metricsContainer");
metrics.style.opacity =
    currentSlide === 0 ? "1" : "0";
setInterval(() => {

    currentSlide = (currentSlide + 1) % slides.length;

    if (visible === "A") {
        imgB.src = slides[currentSlide] + "?v=" + Date.now();

        imgB.classList.add("active");
        imgA.classList.remove("active");

        visible = "B";
    } else {
        imgA.src = slides[currentSlide] + "?v=" + Date.now();

        imgA.classList.add("active");
        imgB.classList.remove("active");

        visible = "A";
    }

    // Show metrics only on Slide1
    metrics.style.opacity =
        currentSlide === 0 ? "1" : "0";

}, 30000);

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString('nl-BE', {
        hour: '2-digit',
        minute: '2-digit'
    });

    document.getElementById('clock').textContent = time;
}
loadData();
updateClock();
setInterval(updateClock, 1000);

// Refresh every 5 minutes to catch GitHub updates
setInterval(() => {
    location.reload();
}, 300000);

</script>

</body>
</html>
